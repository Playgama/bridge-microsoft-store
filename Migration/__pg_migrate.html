<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playgama</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #000; }
</style>
</head>
<body>
<script>
(() => {
    const webview = window.chrome && window.chrome.webview
    if (!webview) {
        return
    }

    const mode = new URLSearchParams(window.location.search).get('mode')
    const chunkLimit = 2 * 1024 * 1024
    const views = {
        Int8Array,
        Uint8Array,
        Uint8ClampedArray,
        Int16Array,
        Uint16Array,
        Int32Array,
        Uint32Array,
        Float32Array,
        Float64Array,
        BigInt64Array,
        BigUint64Array,
        DataView,
    }

    const send = (text) => webview.postMessage(text)
    const post = (message) => send(JSON.stringify(message))

    const toBase64 = (bytes) => {
        let binary = ''
        for (let i = 0; i < bytes.length; i += 0x8000) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
        }
        return btoa(binary)
    }

    const fromBase64 = (text) => {
        const binary = atob(text)
        const bytes = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i)
        }
        return bytes
    }

    const encodeValue = (value, blobs) => {
        if (value === null || typeof value === 'string' || typeof value === 'boolean') {
            return value
        }
        if (typeof value === 'number') {
            return Number.isFinite(value) ? value : { $t: 'number', v: String(value) }
        }
        if (value === undefined) {
            return { $t: 'undefined' }
        }
        if (typeof value === 'bigint') {
            return { $t: 'bigint', v: value.toString() }
        }
        if (value instanceof Date) {
            return { $t: 'date', v: value.getTime() }
        }
        if (value instanceof ArrayBuffer) {
            return { $t: 'buffer', v: toBase64(new Uint8Array(value)) }
        }
        if (ArrayBuffer.isView(value)) {
            const bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength)
            return { $t: 'view', c: value.constructor.name, v: toBase64(bytes) }
        }
        if (value instanceof Blob) {
            const encoded = { $t: 'blob', type: value.type, v: '' }
            if (value instanceof File) {
                encoded.name = value.name
                encoded.lastModified = value.lastModified
            }
            blobs.push([value, encoded])
            return encoded
        }
        if (Array.isArray(value)) {
            return value.map((item) => encodeValue(item, blobs))
        }
        if (value instanceof Map) {
            return { $t: 'map', v: Array.from(value, ([key, item]) => [encodeValue(key, blobs), encodeValue(item, blobs)]) }
        }
        if (value instanceof Set) {
            return { $t: 'set', v: Array.from(value, (item) => encodeValue(item, blobs)) }
        }
        if (value instanceof RegExp) {
            return { $t: 'regexp', source: value.source, flags: value.flags }
        }
        return { $t: 'object', v: Object.fromEntries(Object.keys(value).map((key) => [key, encodeValue(value[key], blobs)])) }
    }

    const encode = async (value) => {
        const blobs = []
        const encoded = encodeValue(value, blobs)
        for (const [blob, target] of blobs) {
            target.v = toBase64(new Uint8Array(await blob.arrayBuffer()))
        }
        return encoded
    }

    const decode = (value) => {
        if (value === null || typeof value !== 'object') {
            return value
        }
        if (Array.isArray(value)) {
            return value.map(decode)
        }
        switch (value.$t) {
            case 'number':
                return Number(value.v)
            case 'undefined':
                return undefined
            case 'bigint':
                return BigInt(value.v)
            case 'date':
                return new Date(value.v)
            case 'buffer':
                return fromBase64(value.v).buffer
            case 'view': {
                const View = views[value.c] || Uint8Array
                return new View(fromBase64(value.v).buffer)
            }
            case 'blob': {
                const bytes = fromBase64(value.v)
                return value.name === undefined
                    ? new Blob([bytes], { type: value.type })
                    : new File([bytes], value.name, { type: value.type, lastModified: value.lastModified })
            }
            case 'map':
                return new Map(value.v.map(([key, item]) => [decode(key), decode(item)]))
            case 'set':
                return new Set(value.v.map(decode))
            case 'regexp':
                return new RegExp(value.source, value.flags)
            case 'object':
                return Object.fromEntries(Object.keys(value.v).map((key) => [key, decode(value.v[key])]))
            default:
                return value
        }
    }

    const request = (req) => new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result)
        req.onerror = () => reject(req.error)
    })

    const completion = (transaction) => new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve()
        transaction.onerror = () => reject(transaction.error)
        transaction.onabort = () => reject(transaction.error || new Error('transaction aborted'))
    })

    const openDatabase = (name, version, upgrade) => new Promise((resolve, reject) => {
        const req = version === undefined ? indexedDB.open(name) : indexedDB.open(name, version)
        req.onupgradeneeded = () => upgrade(req)
        req.onsuccess = () => resolve(req.result)
        req.onerror = () => reject(req.error)
        req.onblocked = () => reject(new Error(`database ${name} is blocked`))
    })

    const deleteDatabase = (name) => new Promise((resolve, reject) => {
        const req = indexedDB.deleteDatabase(name)
        req.onsuccess = () => resolve()
        req.onerror = () => reject(req.error)
        req.onblocked = () => reject(new Error(`database ${name} is blocked`))
    })

    const exportOrigin = async (plan) => {
        const skippedPrefixes = plan.skipLocalStoragePrefixes
        const skippedDatabases = new Set(plan.skipDatabases)
        let skipped = 0

        const items = []
        for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i)
            if (key !== null && !skippedPrefixes.some((prefix) => key.startsWith(prefix))) {
                items.push([key, localStorage.getItem(key)])
            }
        }
        post({ t: 'ls', items })

        for (const info of await indexedDB.databases()) {
            if (!info.name || skippedDatabases.has(info.name)) {
                continue
            }

            post({ t: 'progress' })

            const db = await openDatabase(info.name, undefined, (req) => req.transaction.abort())
            const stores = []
            let contents = []
            try {
                const names = Array.from(db.objectStoreNames)
                if (names.length > 0) {
                    const transaction = db.transaction(names, 'readonly')
                    const finished = completion(transaction)
                    const reads = names.map((name) => {
                        const store = transaction.objectStore(name)
                        stores.push({
                            name,
                            keyPath: store.keyPath,
                            autoIncrement: store.autoIncrement,
                            indexes: Array.from(store.indexNames, (indexName) => {
                                const index = store.index(indexName)
                                return { name: indexName, keyPath: index.keyPath, unique: index.unique, multiEntry: index.multiEntry }
                            }),
                        })
                        return Promise.all([request(store.getAllKeys()), request(store.getAll())])
                            .then(([keys, values]) => ({ name, keys, values }))
                    })
                    contents = await Promise.all(reads)
                    await finished
                }
            } finally {
                db.close()
            }

            post({ t: 'db', name: info.name, version: db.version, stores })

            for (const { name, keys, values } of contents) {
                const head = `{"t":"records","db":${JSON.stringify(info.name)},"store":${JSON.stringify(name)},"items":[`
                let batch = []
                let size = 0
                for (let i = 0; i < keys.length; i += 1) {
                    let entry
                    try {
                        entry = JSON.stringify([await encode(keys[i]), await encode(values[i])])
                    } catch {
                        skipped += 1
                        continue
                    }
                    if (batch.length > 0 && size + entry.length > chunkLimit) {
                        send(`${head}${batch.join(',')}]}`)
                        batch = []
                        size = 0
                    }
                    batch.push(entry)
                    size += entry.length + 1
                }
                if (batch.length > 0) {
                    send(`${head}${batch.join(',')}]}`)
                }
            }
        }

        post({ t: 'end', skipped })
    }

    const loadSource = async (source) => {
        const response = await fetch(source.file, { cache: 'no-store' })
        if (!response.ok) {
            throw new Error(`${source.file}: HTTP ${response.status}`)
        }
        const lines = (await response.text())
            .split('\n')
            .filter((line) => line.length > 0)
            .map((line) => JSON.parse(line))
        if (lines.length === 0 || lines[lines.length - 1].t !== 'end') {
            throw new Error(`${source.file} is incomplete`)
        }
        return lines
    }

    const remapKey = (key, databaseName, sourceHash, targetHash) => {
        if (databaseName !== '/idbfs' || typeof key !== 'string' || !sourceHash || !targetHash) {
            return key
        }
        const from = `/idbfs/${sourceHash}`
        if (key !== from && !key.startsWith(`${from}/`)) {
            return key
        }
        return `/idbfs/${targetHash}${key.slice(from.length)}`
    }

    const hasData = (lines) => lines.some((line) => line.t === 'db' || (line.t === 'ls' && line.items.length > 0))

    const importOrigin = async (plan) => {
        let source = null
        let lines = []
        for (const candidate of plan.sources) {
            const candidateLines = await loadSource(candidate)
            if (hasData(candidateLines)) {
                source = candidate
                lines = candidateLines
                break
            }
        }
        post({ t: 'progress' })

        const items = []
        const databases = new Map()
        for (const line of lines) {
            if (line.t === 'ls') {
                for (const item of line.items) {
                    items.push(item)
                }
            } else if (line.t === 'db') {
                databases.set(line.name, { version: line.version, stores: line.stores, records: new Map() })
            } else if (line.t === 'records') {
                const database = databases.get(line.db)
                if (database) {
                    if (!database.records.has(line.store)) {
                        database.records.set(line.store, [])
                    }
                    const records = database.records.get(line.store)
                    for (const item of line.items) {
                        records.push(item)
                    }
                }
            }
        }
        const sourceHash = source ? source.idbfsHash : null

        localStorage.clear()
        for (const info of await indexedDB.databases()) {
            if (info.name) {
                await deleteDatabase(info.name)
            }
        }

        for (const [key, value] of items) {
            localStorage.setItem(key, value)
        }

        let records = 0
        let skipped = 0
        for (const [name, database] of databases) {
            const db = await openDatabase(name, database.version, (req) => {
                for (const store of database.stores) {
                    const created = req.result.createObjectStore(store.name, { keyPath: store.keyPath, autoIncrement: store.autoIncrement })
                    for (const index of store.indexes) {
                        created.createIndex(index.name, index.keyPath, { unique: index.unique, multiEntry: index.multiEntry })
                    }
                }
            })
            try {
                if (database.stores.length > 0) {
                    const transaction = db.transaction(database.stores.map((store) => store.name), 'readwrite')
                    const finished = completion(transaction)
                    for (const store of database.stores) {
                        const target = transaction.objectStore(store.name)
                        for (const [key, value] of database.records.get(store.name) || []) {
                            try {
                                const req = store.keyPath === null
                                    ? target.put(decode(value), remapKey(decode(key), name, sourceHash, plan.target.idbfsHash))
                                    : target.put(decode(value))
                                req.onsuccess = () => {
                                    records += 1
                                }
                                req.onerror = (event) => {
                                    event.preventDefault()
                                    event.stopPropagation()
                                    skipped += 1
                                }
                            } catch {
                                skipped += 1
                            }
                        }
                    }
                    await finished
                }
            } finally {
                db.close()
            }
            post({ t: 'progress' })
        }

        post({ t: 'done', source: source ? source.host : null, localStorage: items.length, databases: databases.size, records, skipped })
    }

    const run = async () => {
        const response = await fetch('plan.json', { cache: 'no-store' })
        if (!response.ok) {
            throw new Error(`plan.json: HTTP ${response.status}`)
        }
        const plan = await response.json()
        if (mode === 'export') {
            await exportOrigin(plan)
        } else if (mode === 'import') {
            await importOrigin(plan)
        } else {
            throw new Error(`unknown mode: ${mode}`)
        }
    }

    run().catch((error) => post({ t: 'error', message: String((error && error.message) || error) }))
})()
</script>
</body>
</html>
